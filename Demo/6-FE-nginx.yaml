- name: install nginx on frondend server
  hosts: frontend
  connection: ssh # you  can ignore don't mention also fine ansible take bydefault.
  become: yes
  tasks:
  - name: install nginx
    package:      #module check in background which distribution (dnf /apt ) it will applies any ditribution you give same .
      name: nginx
      state: present 
  - name: start nginx
    service:
     name: nginx
     state: started
     enabled: yes

